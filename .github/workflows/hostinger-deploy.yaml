name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Self-hosted runner on David's desktop (user unit actions-runner-worksmart), which
    # costs no Actions minutes; deploys queue while it's off.
    runs-on: [self-hosted, linux, worksmart]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare deploy archive
        run: node scripts/prepare-hostinger-static-archive.mjs --skip-build

      - name: Deploy to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: worksmart-ai.co.uk
          HOSTINGER_REMOVE_ARCHIVE: 'true'
        # The script picks the newest archive itself, and fails the job unless the
        # live site serves the build's deploy-stamp.txt within 5 minutes.
        run: node scripts/deploy-hostinger-static.mjs
